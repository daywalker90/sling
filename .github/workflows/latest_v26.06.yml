name: Latest release on CLN v26.06.x

on:
    release:
        types: [published, edited]
    workflow_dispatch:

jobs:
    call-ci:
        uses: ./.github/workflows/ci.yml
        with:
            cln-version: "v26.06.10"
            pyln-version: "26.6.10"
            tagged-release: true
            python-version-1: "3.11"
            python-version-2: "3.14"
