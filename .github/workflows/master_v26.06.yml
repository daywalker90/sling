name: master on CLN v26.06.x

on:
    push:
        branches:
            - master
        paths-ignore:
            - 'tools/**'
            - 'CHANGELOG.md'
            - 'README.md'
            - 'LICENSE'
            - '.gitignore'
            - 'coffee.yml'
            - 'tests/setup.sh'
    pull_request:
    workflow_dispatch:

jobs:
    call-ci:
        uses: ./.github/workflows/ci.yml
        with:
            cln-version: "v26.06.7"
            pyln-version: "26.6.7"
            tagged-release: false
            python-version-1: "3.10"
            python-version-2: "3.14"
